name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_TERMINAL_PROMPT: 0
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  DOTNET_VERSION: '8.0.x'
  GO_VERSION: '1.24.x'
  JAVA_VERSION: '21'
  KOTLIN_VERSION: '2.0.21'
  # Pinned rather than the runner's preinstalled Gradle: the Kotlin plugin declares the
  # Gradle versions it supports, and a runner image update would silently move past them.
  GRADLE_VERSION: '8.14.3'
  SWIFT_VERSION: '6.0.3'
  RUST_VERSION: 'stable'

jobs:
  # ── Full workspace gate ─────────────────────────────────────────────────────
  full-workspace-gate:
    name: 🧪 Full workspace gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install workspace dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Run full cross-language gate
        run: npm run test:full

  # ── English-only guard ──────────────────────────────────────────────────────
  # Prose is the one thing the other suites never assert on, so this runs without
  # building anything: a translated comment fails in seconds instead of after the
  # full cross-language gate.
  english-only:
    name: 🌐 English-only guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check the workspace is English-only
        run: npm run test:lang

  # ── Live database integration ───────────────────────────────────────────────
  live-db-integration:
    name: 🧪 Live DB integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: an5_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d an5_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: an5_ci_mysql
          MYSQL_DATABASE: an5_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pan5_ci_mysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'An5_ci_Passw0rd!'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Wait for database containers
        run: |
          echo "Waiting for database containers (MSSQL & Postgres)..."
          for i in {1..30}; do
            if node -e "const net = require('net'); const c = (p) => new Promise(r => { const s = new net.Socket(); s.setTimeout(500); s.once('connect', () => { s.destroy(); r(true); }); s.once('error', () => { s.destroy(); r(false); }); s.once('timeout', () => { s.destroy(); r(false); }); s.connect(p, '127.0.0.1'); }); Promise.all([c(1433), c(5432)]).then(res => process.exit(res.every(Boolean) ? 0 : 1));"; then
              echo "Databases are ready on ports 1433 and 5432!"
              sleep 2
              exit 0
            fi
            echo "Waiting for databases to accept connections ($i/30)..."
            sleep 2
          done
          echo "Timeout waiting for database containers!"
          exit 1
      - name: Install workspace dependencies
        run: npm ci
      - name: Build live integration packages
        run: npm run build
      - name: Run live database integration
        run: npm run test:integration:live
        env:
          REQUIRE_LIVE_DB: '1'
          POSTGRES_DATABASE_URL: postgres://postgres:postgres@localhost:5432/an5_ci
          MYSQL_DATABASE_URL: mysql://root:an5_ci_mysql@localhost:3306/an5_ci
          MSSQL_DATABASE_URL: sqlserver://localhost:1433;database=tempdb;user=sa;password=An5_ci_Passw0rd!;encrypt=false;trustServerCertificate=true

  # ── an5Orm ──────────────────────────────────────────────────────────────────
  test-orm:
    name: 🧪 an5Orm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5Orm

  # ── an5Adapters ─────────────────────────────────────────────────────────────
  test-adapters:
    name: 🧪 an5Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Kotlin
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          unzip -q -o "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlinc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install Swift
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz" "https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2204/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p "$RUNNER_TEMP/swift"
          tar xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
          echo "SWIFT_HOME=$RUNNER_TEMP/swift" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Install Gradle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          # GRADLE_HOME, not only PATH: the gate prefers it, and the runner's own Gradle
          # may sit ahead of a prepended PATH entry on a newer major version whose Test
          # task rejects a source set with no tests in it.
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-$GRADLE_VERSION" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5Adapters
      - run: npm run test:package:smoke -w an5Adapters
      - run: npm run test:python -w an5Adapters
      # `test:python` above is a compileall syntax check only. This one creates
      # a real database and exercises the SQLite provider end to end, so a
      # provider that never gets imported cannot pass as working.
      - run: python an5Adapters/test/python/sqlite_smoke.py
      - run: npm run test:dotnet -w an5Adapters
      - run: npm run test:go -w an5Adapters
      - run: npm run test:rust -w an5Adapters
      - run: npm run test:java -w an5Adapters
      - run: npm run test:kotlin -w an5Adapters
      # The Kotlin manifest is what a Gradle consumer resolves, so it is built by Gradle
      # here rather than only being compiled by kotlinc above.
      - run: npm run test:gradle -w an5Adapters
      - run: npm run test:swift -w an5Adapters
      # The shared C vector extension, compiled and tested for real. It needs the
      # SQLite headers the previous step installs, plus a C compiler from the runner.
      - run: npm run test:sqlite:native -w an5Adapters

  # ── an5Agent ────────────────────────────────────────────────────────────────
  test-agent:
    name: 🧪 an5Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5Agent

  # ── an5Cli ──────────────────────────────────────────────────────────────────
  test-cli:
    name: 🧪 an5Cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5Cli

  # ── an5OrmVScode ────────────────────────────────────────────────────────────
  test-vscode:
    name: 🧪 an5OrmVScode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5OrmVScode

  # ── an5Client ───────────────────────────────────────────────────────────────
  test-client:
    name: 🧪 an5Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Kotlin
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          unzip -q -o "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlinc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install Swift
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz" "https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2204/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p "$RUNNER_TEMP/swift"
          tar xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
          echo "SWIFT_HOME=$RUNNER_TEMP/swift" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5Client
      - run: npm run test:package:smoke -w an5Client
      - run: npm run test:python -w an5Client
      - run: npm run test:dotnet -w an5Client
      - run: npm run test:go -w an5Client
      - run: npm run test:rust -w an5Client
      - run: npm run test:java -w an5Client

  # ── an5example ───────────────────────────────────────────────────────────────
  test-example:
    name: 🧪 an5example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Kotlin
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          unzip -q -o "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlinc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install Swift
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz" "https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2204/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p "$RUNNER_TEMP/swift"
          tar xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
          echo "SWIFT_HOME=$RUNNER_TEMP/swift" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: npm ci
      - run: npm run build
      # Maven is what runs the Java example; without it the gate would skip rather than
      # fail, and a green job that never compiled Java would be worse than no job.
      - run: mvn -v
      - run: npm test -w an5example

  # ── an5Tasks ────────────────────────────────────────────────────────────────
  test-tasks:
    name: 🧪 an5Tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm test -w an5Tasks

  # ── Summary ─────────────────────────────────────────────────────────────────
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs:
      - full-workspace-gate
      - english-only
      - live-db-integration
      - test-orm
      - test-adapters
      - test-agent
      - test-cli
      - test-vscode
      - test-client
      - test-example
      - test-tasks
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          failed = [k for k,v in d.items() if v['result'] not in ('success','skipped')]
          print('\n'.join(failed))
          ")
          if [ -n "$failed" ]; then
            echo "❌ Failed jobs:"
            echo "$failed"
            exit 1
          fi
          echo "✅ All CI jobs passed!"
