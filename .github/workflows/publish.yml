name: Publish releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish-npm:
        description: 'Publish all public npm workspace packages'
        type: boolean
        default: true
      publish-pypi:
        description: 'Publish PyPI packages (adapters, ORM and client)'
        type: boolean
        default: true
      publish-maven:
        description: 'Publish the Java and Kotlin adapters to Maven Central'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Test All Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install dependencies
        run: npm install
      - name: Build all workspaces
        run: npm run build
      - name: Run full cross-language gate
        run: npm run test:full

  publish-npm:
    name: Publish npm packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-npm == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & build
        run: |
          npm install
          npm run build

      - name: Publish @an5/adapters to npm
        working-directory: an5Adapters
        run: |
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/adapters@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and @an5/adapters this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @an5/orm to npm
        working-directory: an5Orm
        run: |
          # `--if-present` is what this tolerates: a workspace with nothing to
          # publish. A 403 or a network error must not be tolerated the same
          # way, or the job reports success having published nothing — which is
          # what happened when the npm account was suspended.
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/orm@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @an5/agent to npm
        # The agent was already on npm but no job published it, so a v* tag
        # could never release it and its work stayed in the repo.
        working-directory: an5Agent
        run: |
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/agent@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and @an5/agent this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish an5Client to npm
        working-directory: an5Client
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Release already exists."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish an5Cli to npm
        working-directory: an5Cli
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Release already exists."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


  publish-pypi:
    name: Publish PyPI packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-pypi == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install build twine

      - name: Build an5-adapters
        working-directory: an5Adapters
        run: python -m build --outdir dist-py

      - name: Publish an5-adapters to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Adapters/dist-py/
          skip-existing: true

      - name: Build an5-orm
        working-directory: an5Orm
        run: python -m build --outdir dist-py

      - name: Publish an5-orm to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Orm/dist-py/
          skip-existing: true

      - name: Build an5-client
        working-directory: an5Client
        run: python -m build --outdir dist-py

      - name: Publish an5-client to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Client/dist-py/
          skip-existing: true

  publish-maven:
    name: Publish Java and Kotlin adapters to Maven Central
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-maven == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-java imports the signing key as MAVEN_GPG_PASSPHRASE. It is deliberately not
      # asked to write the `central` server: setup-java copies `server-username` into
      # settings.xml verbatim, so the plugin would upload with `userId=MAVEN_CENTRAL_USERNAME`
      # — the variable's name rather than the token's owner — and the Portal rejects the
      # deployment with `Bundle has content that does NOT have a .pom file`. The server entry
      # is written below with `${env.…}`, which Maven resolves from the environment.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Write the Central Portal server entry
        # Written whole rather than appended: setup-java writes settings.xml only when it is
        # asked for a server, and an appended <server> block outside a <servers> element is
        # silently ignored.
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>\${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>\${env.MAVEN_CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

      - name: Install Gradle
        env:
          GRADLE_VERSION: '8.14.3'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-$GRADLE_VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches the workspace version
        # A tag publishes whatever each submodule manifest declares, so a tag that does not
        # match the workspace version republishes the previous release's package versions —
        # which the registries reject as already existing, halfway through a deployment.
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          workspace=$(node -p "require('./package.json').version")
          if [ "$version" != "$workspace" ]; then
            echo "::error::tag $TAG does not match the workspace version $workspace — bump package.json or publish a different tag"
            exit 1
          fi

      # Both manifests are built before anything is uploaded: a publish that fails halfway
      # leaves a deployment the portal still has to be cleaned up for, and a broken build
      # should be found here instead.
      - name: Build both adapters
        run: |
          mvn -B -f an5Adapters/java/pom.xml install -DskipTests
          gradle -p an5Adapters/kotlin build --console=plain --no-daemon

      - name: Publish the Java adapter
        # `verify` is the phase the release profile binds
        # central-publishing-maven-plugin:publish to. Asking for `deploy` runs that
        # upload and then falls through to maven-deploy-plugin:default-deploy, which
        # needs a <distributionManagement> this POM does not have, so the artifact is
        # already published by the time that goal fails.
        run: |
          version=$(node -p "require('./an5Adapters/package.json').version")
          if mvn -B -f an5Adapters/java/pom.xml -Prelease verify; then
            echo "published an5-adapters-java:$version"
          else
            if curl -fsS "https://central.sonatype.com/api/internal/browse/component/versions?sortField=normalizedVersion&sortDirection=desc&page=0&size=20&filter=namespace%3Aio.github.an5orm&filter=name%3Aan5-adapters-java" | grep -q "\"$version\""; then
              echo "already on Central, skipping an5-adapters-java:$version"
            else
              echo "::error::maven publish failed and an5-adapters-java:$version is not on Central"
              exit 1
            fi
          fi
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish the Kotlin adapter
        run: |
          version=$(node -p "require('./an5Adapters/package.json').version")
          if gradle -p an5Adapters/kotlin publish --console=plain --no-daemon; then
            echo "published an5-adapters-kotlin:$version"
          else
            if curl -fsS "https://central.sonatype.com/api/internal/browse/component/versions?sortField=normalizedVersion&sortDirection=desc&page=0&size=20&filter=namespace%3Aio.github.an5orm&filter=name%3Aan5-adapters-kotlin" | grep -q "\"$version\""; then
              echo "already on Central, skipping an5-adapters-kotlin:$version"
            else
              echo "::error::gradle publish failed and an5-adapters-kotlin:$version is not on Central"
              exit 1
            fi
          fi
      - name: Confirm both artifacts are on Central
        # Gradle reports success once the upload is accepted, which for the legacy
        # OSSRH endpoint is not the same as being released: the artifact can sit in a
        # staging repository. This step is what turns that difference into a failure
        # instead of a green run that published nothing.
        run: |
          version=$(node -p "require('./an5Adapters/package.json').version")
          status=0
          for artifact in an5-adapters-java an5-adapters-kotlin; do
            url="https://repo1.maven.org/maven2/io/github/an5orm/$artifact/$version/$artifact-$version.jar"
            found=""
            for _ in $(seq 1 60); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then found=yes; break; fi
              sleep 30
            done
            if [ "$found" = "yes" ]; then
              echo "$artifact:$version is on Central"
            else
              echo "::error::$artifact:$version is not on Central after 30 minutes"
              status=1
            fi
          done
          exit $status
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  release:
    name: Publish workspace release manifest
    needs: [build-and-test, publish-npm, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Write exact package versions
        run: |
          node - <<'JS' > release-notes.md
          console.log('Packages built and tested from the submodule commits pinned by this release.\n');
          for (const directory of ['an5Adapters', 'an5Orm', 'an5Client', 'an5Agent', 'an5Cli', 'an5OrmVScode']) {
            const pkg = require(`./${directory}/package.json`);
            console.log(`- ${pkg.name}: ${pkg.version}`);
          }
          console.log('\nThe extension is released by its own repository workflow. VS Code Marketplace upload remains manual.');
          JS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
