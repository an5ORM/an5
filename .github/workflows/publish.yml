name: Publish releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish-npm:
        description: 'Publish all public npm workspace packages'
        type: boolean
        default: true
      publish-pypi:
        description: 'Publish PyPI packages (adapters, ORM and client)'
        type: boolean
        default: true
      publish-maven:
        description: 'Publish the Java and Kotlin adapters to Maven Central'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Test All Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install dependencies
        run: npm install
      - name: Build all workspaces
        run: npm run build
      - name: Run full cross-language gate
        run: npm run test:full

  publish-npm:
    name: Publish npm packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-npm == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & build
        run: |
          npm install
          npm run build

      - name: Publish @an5/adapters to npm
        working-directory: an5Adapters
        run: |
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/adapters@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and @an5/adapters this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @an5/orm to npm
        working-directory: an5Orm
        run: |
          # `--if-present` is what this tolerates: a workspace with nothing to
          # publish. A 403 or a network error must not be tolerated the same
          # way, or the job reports success having published nothing — which is
          # what happened when the npm account was suspended.
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/orm@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @an5/agent to npm
        # The agent was already on npm but no job published it, so a v* tag
        # could never release it and its work stayed in the repo.
        working-directory: an5Agent
        run: |
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/agent@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and @an5/agent this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish an5Client to npm
        working-directory: an5Client
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Release already exists."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish an5Cli to npm
        working-directory: an5Cli
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Release already exists."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


  publish-pypi:
    name: Publish PyPI packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-pypi == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install build twine

      - name: Build an5-adapters
        working-directory: an5Adapters
        run: python -m build --outdir dist-py

      - name: Publish an5-adapters to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Adapters/dist-py/
          skip-existing: true

      - name: Build an5-orm
        working-directory: an5Orm
        run: python -m build --outdir dist-py

      - name: Publish an5-orm to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Orm/dist-py/
          skip-existing: true

      - name: Build an5-client
        working-directory: an5Client
        run: python -m build --outdir dist-py

      - name: Publish an5-client to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Client/dist-py/
          skip-existing: true

  publish-maven:
    name: Publish Java and Kotlin adapters to Maven Central
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-maven == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # setup-java writes the settings.xml entry with id `central` that the publishing
      # plugin reads, and imports the signing key as MAVEN_GPG_PASSPHRASE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Install Gradle
        env:
          GRADLE_VERSION: '8.14.3'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-$GRADLE_VERSION" >> "$GITHUB_ENV"

      - name: Check the tag matches the workspace version
        # A tag publishes whatever each submodule manifest declares, so a tag that does not
        # match the workspace version republishes the previous release's package versions —
        # which the registries reject as already existing, halfway through a deployment.
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          workspace=$(node -p "require('./package.json').version")
          if [ "$version" != "$workspace" ]; then
            echo "::error::tag $TAG does not match the workspace version $workspace — bump package.json or publish a different tag"
            exit 1
          fi

      # Both manifests are built before anything is uploaded: a publish that fails halfway
      # leaves a deployment the portal still has to be cleaned up for, and a broken build
      # should be found here instead.
      - name: Build both adapters
        run: |
          mvn -B -f an5Adapters/java/pom.xml install -DskipTests
          gradle -p an5Adapters/kotlin build --console=plain --no-daemon

      - name: Publish the Java adapter
        run: mvn -B -f an5Adapters/java/pom.xml -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish the Kotlin adapter
        run: gradle -p an5Adapters/kotlin publish --console=plain --no-daemon
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  release:
    name: Publish workspace release manifest
    needs: [build-and-test, publish-npm, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Write exact package versions
        run: |
          node - <<'JS' > release-notes.md
          console.log('Packages built and tested from the submodule commits pinned by this release.\n');
          for (const directory of ['an5Adapters', 'an5Orm', 'an5Client', 'an5Agent', 'an5Cli', 'an5OrmVScode']) {
            const pkg = require(`./${directory}/package.json`);
            console.log(`- ${pkg.name}: ${pkg.version}`);
          }
          console.log('\nThe extension is released by its own repository workflow. VS Code Marketplace upload remains manual.');
          JS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
