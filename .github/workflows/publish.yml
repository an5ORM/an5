name: Publish to npm and PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish-npm:
        description: 'Publish npm packages (@an5/adapters, @an5/orm)'
        type: boolean
        default: true
      publish-pypi:
        description: 'Publish PyPI packages (an5-adapters, an5-orm)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build & Test All Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync submodules to latest main
        run: git submodule update --init --recursive --remote || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install dependencies
        run: npm install
      - name: Build all workspaces
        run: npm run build
      - name: Run full cross-language gate
        run: npm run test:full

  publish-npm:
    name: Publish npm packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-npm == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync submodules to latest main
        run: git submodule update --init --recursive --remote || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies & build
        run: |
          npm install
          npm run build

      - name: Publish @an5/adapters to npm
        working-directory: an5Adapters
        run: |
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/adapters@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and @an5/adapters this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @an5/orm to npm
        working-directory: an5Orm
        run: |
          # `--if-present` is what this tolerates: a workspace with nothing to
          # publish. A 403 or a network error must not be tolerated the same
          # way, or the job reports success having published nothing — which is
          # what happened when the npm account was suspended.
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/orm@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @an5/agent to npm
        # The agent was already on npm but no job published it, so a v* tag
        # could never release it and its work stayed in the repo.
        working-directory: an5Agent
        run: |
          if npm publish --access public --if-present; then
            echo "published"
          else
            status=$?
            if npm view "@an5/agent@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
              echo "already on the registry, skipping"
            else
              echo "::error::npm publish failed (exit $status) and @an5/agent this version is not on the registry"
              exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-pypi == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync submodules to latest main
        run: git submodule update --init --recursive --remote || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install build twine

      - name: Build an5-adapters
        working-directory: an5Adapters
        run: python -m build --outdir dist-py

      - name: Publish an5-adapters to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Adapters/dist-py/
          skip-existing: true

      - name: Build an5-orm
        working-directory: an5Orm
        run: python -m build --outdir dist-py

      - name: Publish an5-orm to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: an5Orm/dist-py/
          skip-existing: true

  publish-vscode:
    name: Publish VS Code Extension
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & package extension
        # Installed from the repository root, not from the workspace member:
        # `npm install` inside an5OrmVScode left @types/node where tsc could
        # not see it, and vsce's prepublish compile failed with "Cannot find
        # type definition file for 'node'". The root install hoists correctly,
        # which is also what the build-and-test job does.
        run: |
          npm install
          npm run package -w an5OrmVScode
      - name: Publish to Open VSX Registry
        working-directory: an5OrmVScode
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not provided, skipping Open VSX publish"
            exit 0
          fi
          npx ovsx publish *.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Publish to VS Code Marketplace
        working-directory: an5OrmVScode
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not provided, skipping Marketplace publish"
            exit 0
          fi
          npx @vscode/vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
